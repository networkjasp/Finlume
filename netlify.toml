# Finlume website, Netlify settings (generated by build.py, edit build.py rather than this file).
# Netlify runs build.py, which turns the text in content/*.json into the finished pages in dist/.
[build]
  command = "python3 build.py"
  publish = "dist"
  functions = "netlify/functions"

# Only SMTP_PASS is a real secret. These other settings are public information that also
# appears on the website (business name, email addresses), so Netlify's secret scanner must
# not treat them as leaked secrets.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FORM_SITE_NAME,SMTP_USER,MAIL_TO,SMTP_HOST,SMTP_PORT"

# Friendly addresses
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  # Rate limit on the contact page: max 30 requests per minute from one IP address
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/Finlume-Company-Profile.pdf"
  status = 301
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# Website editor: /studio/ (opened by clicking the © symbol 5 times). Short address too.
[[redirects]]
  from = "/studio"
  to = "/studio/"
  status = 301
  force = true

# Block common hacking probes (this site has no PHP or database; the editor lives at /studio/)
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Security headers. Every page carries its own strict Content-Security-Policy in a <meta> tag
# (fingerprinted scripts only). The editor gets its own policy below.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

# Website editor: never indexed, never cached, and only talks to this site, GitHub and Netlify sign-in.
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.githubusercontent.com https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com https://api.netlify.com https://*.githubusercontent.com; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Caching for images and documents (pages themselves are always re-checked)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"


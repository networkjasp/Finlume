# Finlume website, Netlify settings. Plain static site: no build command needed.
[build]
  publish = "."

# Friendly addresses
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
  # Rate limit on the contact page: max 30 requests per minute from one IP address
  [redirects.rate_limit]
  window_limit = 30
  window_size = 60
  aggregate_by = ["ip", "domain"]
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/Finlume-Company-Profile.pdf"
  status = 301
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# Block common hacking probes (this site has no admin area, PHP or database)
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Caching for images and documents (pages themselves are always re-checked)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

